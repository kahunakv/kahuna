message GrpcCompletionReceiptEntry {
  int32  TransactionIdNode     = 1;
  int64  TransactionIdPhysical = 2;
  uint32 TransactionIdCounter  = 3;
  string Key                   = 4;
  optional string RecordAnchorKey = 5;
  int32  Durability            = 6;
}

message GrpcImportCompletionReceiptsRequest {
  repeated GrpcCompletionReceiptEntry Receipts = 1;
  // Data partition whose Raft log the receipts must be replicated onto so every replica of the
  // destination range holds them after a split/merge handoff. Zero when the message is reused as an
  // on-disk snapshot container (no destination routing needed).
  int32 DestinationPartitionId = 2;
  // When true the batch forgets the listed receipts on every replica of the partition (a durable
  // coordinator acknowledgement releasing the proof) instead of recording them.
  bool Forget = 3;
}

message GrpcImportCompletionReceiptsResponse {
  bool Success = 1;
}

// One bounded, checksummed page of key-values being moved by a range split/merge, forwarded to the
// destination partition's leader so it replicates the page's entries onto that partition's Raft log —
// every replica of the destination applies them, and a leader change mid-copy loses nothing. The page
// bytes are a serialized RangeSnapshotPage (the same checksummed frame the range transfer uses).
message GrpcReplicateKeyValueRangePageRequest {
  int32 PartitionId = 1;
  bytes Page = 2;
}

message GrpcReplicateKeyValueRangePageResponse {
  bool Success = 1;
}

// Reads the transaction state a moving key range carries — completion receipts, canonical transaction
// records and prepared intents whose key/anchor falls in [StartKey, EndKey) — from the node that leads
// the source partition, whose stores are authoritative. Used by split/merge to gather the handoff set
// when the driving node is not a replica of the source range. Absent bounds mean -inf / +inf.
message GrpcGetRangeTransactionStateRequest {
  optional string StartKey = 1;
  optional string EndKey = 2;
  // The source partition whose confirmed leader must answer: a follower's stores can lag the
  // newest prepared intent, and a handoff missing an intent strands its transaction after cutover.
  int32 PartitionId = 3;
  // Bitmask selecting which state kinds the response carries: 1 receipts, 2 records, 4 intents.
  // 0 (unset) means all three — the pre-paging wire behaviour, which an old peer also answers with.
  int32 Kinds = 4;
  // Resume strictly after this range key (the receipt/intent key, or the record's anchor key).
  // The number of items in a busy range has no ceiling, so an unpaged response can exceed the
  // transport's message limit; the caller pages instead. Absent means "from StartKey".
  optional string Cursor = 5;
  // Cap on the items in this page. Applied only when exactly one kind is selected — a shared
  // cursor cannot page heterogeneous kinds. Items that share one range key never straddle a page
  // (the resume is strictly-after by key), so a page can exceed the cap by that key's items.
  // 0 means unbounded (the pre-paging behaviour).
  int32 MaxItems = 6;
}

message GrpcGetRangeTransactionStateResponse {
  bool Success = 1;
  repeated GrpcCompletionReceiptEntry Receipts = 2;
  // Serialized TransactionRecordSnapshotMessage / PreparedIntentSnapshotMessage blobs, empty when none.
  bytes TransactionRecords = 3;
  bytes PreparedIntents = 4;
  // True when the page was cut by MaxItems and more items remain past NextCursor. An old peer
  // never sets it — its response already carried everything.
  bool HasMore = 5;
  optional string NextCursor = 6;
}

// A batch of coordinator decision records serialized as one CoordinatorDecisionSnapshotMessage blob.
message GrpcImportCoordinatorDecisionsRequest {
  bytes Records = 1;
  // Data partition whose Raft log the decision records must be replicated onto so every replica of
  // the destination range holds them after a split/merge handoff.
  int32 DestinationPartitionId = 2;
}

message GrpcImportCoordinatorDecisionsResponse {
  bool Success = 1;
}

// A durable-intent 2PC operation forwarded from the coordinator to the partition leader node so it runs where the
// node is the Raft leader (proposals) and holds the staged write intent (commit/rollback apply).
message GrpcDurableOperationRequest {
  int32 PartitionId = 1;
  int32 Kind = 2;        // 0 = replicate delta, 1 = commit-apply, 2 = rollback-apply
  string LogType = 3;    // replicate only (the Raft log type)
  bytes Payload = 4;     // the serialized delta (replicate) or the serialized prepared intent (commit/rollback)
}

message GrpcDurableOperationResponse {
  bool Committed = 1;    // replicate: whether the batch committed; commit/rollback: applied
}

// Asks a replica of one data partition for its staged-base fence verdict on each of one transaction's
// validated-base prepares, judged against the replica's own applied intent and committed-head memory. The
// pre-decision half of the replica fence: the commit is proposed only after these verdicts are read, so a
// refusal that previously raced the commit as a detached veto now arrives ahead of it. Answered by any
// replica — no leader confirmation, because the verdict is about THIS node's memory.
message GrpcGetStagedBaseVerdictsRequest {
  int32 PartitionId = 1;
  int32 TransactionIdNode = 2;
  int64 TransactionIdPhysical = 3;
  uint32 TransactionIdCounter = 4;
  int64 Epoch = 5;
  repeated string Keys = 6;
  // How long the replica may wait for the prepare to apply locally before answering NotApplied for the
  // remaining keys. Bounded server-side; 0 answers immediately.
  int32 WaitMs = 7;
}

// One key's verdict: 0 NotApplied (this node holds no matching intent and cannot attest), 1 Clear,
// 2 StaleBase (the fence memory proves the validated base moved). HeadRevision is the committed head the
// verdict was judged against, -1 when the memory held nothing for the key.
message GrpcStagedBaseVerdict {
  int32 Verdict = 1;
  int64 HeadRevision = 2;
}

message GrpcGetStagedBaseVerdictsResponse {
  bool Serviced = 1;
  // Aligned with the request's Keys, in order.
  repeated GrpcStagedBaseVerdict Verdicts = 2;
}

// A linearizable lookup of a transaction's canonical record, routed from a consult site to the partition leader
// that owns the record's anchor key so the answer is authoritative rather than a node-local projection.
message GrpcLookupTransactionRecordRequest {
  int32 PartitionId = 1;
  int32 TransactionIdNode = 2;
  int64 TransactionIdPhysical = 3;
  uint32 TransactionIdCounter = 4;
  int64 Epoch = 5;
  string AnchorKey = 6;
}

message GrpcLookupTransactionRecordResponse {
  bool Found = 1;
  bytes Record = 2;      // the serialized canonical record when Found; empty otherwise
}

