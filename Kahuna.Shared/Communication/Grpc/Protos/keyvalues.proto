  DECISION_DURABILITY_BEST_EFFORT = 0;
  DECISION_DURABILITY_DURABLE = 1;
}
// Offset by one from Kahuna.Shared.KeyValue.TransactionPriority so that zero — the value a peer that
// predates this field necessarily sends — means "not specified" and resolves to Normal, rather than
// silently demoting every old client's transactions to Background. Convert with TransactionPriorityWire,
// never with a raw cast.
enum GrpcTransactionPriority {
  TRANSACTION_PRIORITY_UNSPECIFIED = 0;
  TRANSACTION_PRIORITY_BACKGROUND = 1;
  TRANSACTION_PRIORITY_LOW = 2;
  TRANSACTION_PRIORITY_NORMAL = 3;
  TRANSACTION_PRIORITY_HIGH = 4;
  TRANSACTION_PRIORITY_CRITICAL = 5;
}
message GrpcAcquireSnapshotHoldRequest {
  string HolderId          = 1;
  int32  TimestampNode     = 2;
  int64  TimestampPhysical = 3;
  uint32 TimestampCounter  = 4;
  int32  LeaseMs           = 5;
}

message GrpcAcquireSnapshotHoldResponse {
  GrpcKeyValueResponseType Type             = 1;
  string                   HoldId           = 2;
  int32                    LeaseExpiryNode     = 3;
  int64                    LeaseExpiryPhysical = 4;
  uint32                   LeaseExpiryCounter  = 5;
}

message GrpcRenewSnapshotHoldRequest {
  string HoldId  = 1;
  int32  LeaseMs = 2;
}

message GrpcRenewSnapshotHoldResponse {
  GrpcKeyValueResponseType Type               = 1;
  int32                    LeaseExpiryNode     = 2;
  int64                    LeaseExpiryPhysical = 3;
  uint32                   LeaseExpiryCounter  = 4;
}

message GrpcReleaseSnapshotHoldRequest {
  string HoldId = 1;
}

message GrpcReleaseSnapshotHoldResponse {
  GrpcKeyValueResponseType Type = 1;
}

message GrpcGetSnapshotFloorRequest {
}

message GrpcGetSnapshotFloorResponse {
  int32  EffectiveFloorNode     = 1;
  int64  EffectiveFloorPhysical = 2;
  uint32 EffectiveFloorCounter  = 3;
  int32  LiveHolds              = 4;
  // TYPE_GOT on an authoritative answer; TYPE_MUST_RETRY when the answering node could not
  // confirm meta-partition leadership and refused to report from possibly-stale local state.
  // Absent (TYPE_SET, the enum default) from servers predating this field — treated as success.
  GrpcKeyValueResponseType Type = 5;
}
