enum GrpcKeyValueFlags {
  NONE = 0;
  SET = 1;
  SET_NO_REVISION = 2;
  SET_IF_EXISTS = 4;
  SET_IF_NOT_EXISTS = 8;
  SET_IF_EQUAL_TO_VALUE = 16;
  SET_IF_EQUAL_TO_REVISION = 32;
}

enum GrpcKeyValueResponseType {
  TYPE_SET = 0;
  TYPE_NOTSET = 1;
  TYPE_EXTENDED = 2;
  TYPE_GOT = 3;
  TYPE_DELETED = 4;
  TYPE_LOCKED = 5;
  TYPE_UNLOCKED = 6;
  TYPE_PROPOSED = 7;
  TYPE_COMMITTED = 8;
  TYPE_ROLLEDBACK = 9;
  TYPE_EXISTS = 10;
  TYPE_ERRORED = 99;
  TYPE_INVALID_INPUT = 100;
  TYPE_MUST_RETRY = 101;
  TYPE_ABORTED = 102;
  TYPE_DOES_NOT_EXIST = 103;
  TYPE_ALREADY_LOCKED = 104;
  TYPE_PREFIX_LOCK_UNSUPPORTED_ON_RANGED_SPACE = 105;
  // 106 and 107 are internal actor-only results that never reach an external caller. They are declared
  // here so the numbering matches the C# enum and cannot be reused by a future external value.
  TYPE_RANGE_LOCKS = 106;
  TYPE_SAFE_TIMESTAMP = 107;
  // The node refused to admit the transaction: its admission queue was full, or the caller's admission
  // wait budget expired. Nothing was started, so a retry is safe — but the node is shedding load, so the
  // caller should back off first. Deliberately distinct from TYPE_MUST_RETRY, which is transient and
  // should be retried promptly.
  TYPE_ADMISSION_REFUSED = 108;
}

