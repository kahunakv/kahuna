  int32  ExpiresMs              = 9;
  GrpcKeyValueDurability Durability = 10;
  GrpcRangeLockMode Mode        = 11;
  string CoordinatorKey         = 12;
  uint64 OperationIdHigh        = 13;
  uint64 OperationIdLow         = 14;
}

