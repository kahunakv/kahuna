  int32  TransactionIdNode      = 1;
  int64  TransactionIdPhysical  = 2;
  uint32 TransactionIdCounter   = 3;
  string Prefix                 = 4;
  optional string StartKey      = 5;
  bool   StartInclusive         = 6;
  optional string EndKey        = 7;
  bool   EndInclusive           = 8;
  GrpcKeyValueDurability Durability = 9;
  // When set, the receiver runs the release on its own local actor state instead of re-routing
  // through its locator. The sender targeted the node where the lock was acquired (a split/merge
  // quiesce release); after a cutover the receiver's range map routes the bounds to the new
  // partition, which would misdirect the release and strand its per-key write intents.
  optional int32 TargetPartitionId = 10;
}

