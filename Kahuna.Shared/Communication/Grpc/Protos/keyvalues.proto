// Probes several keys owned by the same node for concurrent write intents in one call, so a commit
// validating a large read set costs one round trip per node holding part of it rather than one per key.
message GrpcTryCheckManyWriteIntentsRequest {
  int32 TransactionIdNode = 1;
  int64 TransactionIdPhysical = 2;
  uint32 TransactionIdCounter = 3;
  repeated GrpcTryCheckManyWriteIntentsRequestItem Items = 4;
}

message GrpcTryCheckManyWriteIntentsRequestItem {
  string Key = 1;
  GrpcKeyValueDurability Durability = 2;
  // KeyValueConflictChecks bit set: which conflict classes to answer for this key
  // (1 = concurrent write intent, 2 = foreign range lock, 4 = staged base moved). Selected per key
  // because one probe carries a transaction's read set and its write set, which ask different questions.
  uint32 Checks = 3;
  // For the staged-base check (4): the committed base the caller's read-modify-write of this key was
  // validated against — the revision when the base existed, or -1 when the validated base was
  // "key does not exist". Ignored by every other check. Absent on the wire (0) only when the staged-base
  // check is not requested, so the -1 sentinel is always explicit when it matters.
  sint64 BaseRevision = 4;
}

message GrpcTryCheckManyWriteIntentsResponse {
  optional string ServedFrom = 1;
  repeated GrpcTryCheckManyWriteIntentsResponseItem Items = 2;
}

message GrpcTryCheckManyWriteIntentsResponseItem {
  GrpcKeyValueResponseType Type = 1;
  string Key = 2;
  GrpcKeyValueDurability Durability = 3;
}

