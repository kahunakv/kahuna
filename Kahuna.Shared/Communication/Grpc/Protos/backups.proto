syntax = "proto3";

service Backups {
  rpc TakeFullBackup        (GrpcTakeFullBackupRequest)        returns (GrpcBackupInfoResponse);
  rpc TakeIncrementalBackup (GrpcTakeIncrementalBackupRequest) returns (GrpcBackupInfoResponse);
  rpc TakeCoordinatedBackup (GrpcTakeCoordinatedBackupRequest) returns (GrpcBackupInfoResponse);
  rpc ListBackups           (GrpcListBackupsRequest)           returns (GrpcListBackupsResponse);
  rpc GetBackupChain        (GrpcGetBackupChainRequest)        returns (GrpcListBackupsResponse);
  rpc ValidateChain         (GrpcValidateChainRequest)         returns (GrpcListBackupsResponse);
  rpc Restore               (GrpcRestoreRequest)               returns (GrpcRestoreResponse);
  rpc RunBackupGarbageCollection (GrpcBackupGcRequest)         returns (GrpcBackupGcResponse);

  // Inter-node: one node's share of a cluster-wide backup. The composing node sends the request. A full share
  // proposes its view of the cut and waits for the agreed Cut, captures at it, streams every artifact (begin,
  // data..., end per file), reports that it is captured and waits for Proceed — once every share is captured —
  // before its final cut check. The result ends the stream.
  rpc CaptureBackupPart (stream GrpcBackupPartControl) returns (stream GrpcBackupPartChunk);
}

message GrpcCaptureBackupPartRequest {
  int32  Kind                       = 1;
  repeated int32 Partitions         = 2;
  int64  ExpectedTopologyGeneration = 6;
  // The parent chain of an incremental share, full first, one manifest document per entry.
  repeated string ParentChainJson   = 7;
}

message GrpcBackupPartControl {
  oneof Body {
    GrpcCaptureBackupPartRequest Request = 1;
    bool Proceed                         = 2;
    GrpcBackupHlc Cut                    = 3;
  }
}

message GrpcBackupHlc {
  int32  Node     = 1;
  int64  Physical = 2;
  uint32 Counter  = 3;
}

message GrpcBackupCutProposal {
  GrpcBackupHlc MinInFlight  = 1;
  GrpcBackupHlc MaxCommitted = 2;
}

message GrpcBackupPartChunk {
  oneof Body {
    string BeginFile               = 1;
    bytes  Data                    = 2;
    bool   EndFile                 = 3;
    GrpcBackupPartResult Result    = 4;
    string CapturedManifestJson    = 5;
    GrpcBackupCutProposal CutProposal = 6;
  }
}

message GrpcBackupPartResult {
  int32  Outcome      = 1;
  string Message      = 2;
  string ManifestJson = 3;
  // With a NotCaughtUp outcome: the requested partitions whose committed writes the node had not applied.
  repeated int32 LaggingPartitions = 4;
}

message GrpcTakeFullBackupRequest {
}

message GrpcTakeIncrementalBackupRequest {
  string ParentBackupId = 1;
}

message GrpcTakeCoordinatedBackupRequest {
}

message GrpcListBackupsRequest {
}

message GrpcGetBackupChainRequest {
  string LeafBackupId = 1;
}

message GrpcValidateChainRequest {
  string LeafBackupId = 1;
}

message GrpcBackupInfoResponse {
  string BackupId           = 1;
  string Type               = 2;
  string CreatedAtUtc       = 3;
  string ParentBackupId     = 4;
  int32  PartitionCount     = 5;
  bool   HasSnapshotTime    = 6;
  int32  SnapshotNode       = 7;
  int64  SnapshotPhysical   = 8;
  uint32 SnapshotCounter    = 9;
  // Requested vs actual kind and substitution reason (empty string = null).
  string RequestedKind      = 10;
  string ActualKind         = 11;
  string SubstitutionReason = 12;
  // Legacy/invalid listing.
  int32  FormatVersion      = 13;
  bool   IsInvalid          = 14;
  string InvalidReason      = 15;
  // Chain coverage bounds (only set on a resolved chain's head entry).
  bool   HasCoverage        = 16;
  int64  MinRecoverablePhysicalMs = 17;
  int64  MaxRecoverablePhysicalMs = 18;
  // Cluster/coordinator identity (empty string = null). Lets a listing from any node reveal which
  // cluster and which node produced each backup, so a per-node (partial) catalog is visible.
  string ClusterId          = 19;
  string CoordinatorNode    = 20;
  // Artifacts exist for this id but no manifest does: the backup never completed (or is still in
  // flight). Such entries also set IsInvalid, so older callers still refuse to use them.
  bool   IsIncomplete       = 21;
}

message GrpcListBackupsResponse {
  repeated GrpcBackupInfoResponse Backups = 1;
}

message GrpcRestoreRequest {
  string LeafBackupId  = 1;
  string TargetDir     = 2;
  int64  TargetTimeMs  = 3;
}

message GrpcRestoreResponse {
  string TargetDir             = 1;
  int32  PartitionsRestored    = 2;
  int64  EntriesApplied        = 3;
  int64  LastAppliedPhysicalMs = 4;
  repeated GrpcBackupInfoResponse Chain = 5;
  string Outcome               = 6; // KahunaBackupOutcome name
  int64  MinRecoverablePhysicalMs = 7;
  int64  MaxRecoverablePhysicalMs = 8;
}

message GrpcBackupGcRequest {
  bool DryRun = 1;
}

message GrpcBackupGcResponse {
  bool  Applied       = 1;
  int64 BytesReclaimed = 2;
  repeated GrpcBackupGcDeletion RetentionDeletions = 3;
  repeated GrpcBackupGcOrphan   OrphanReclamations = 4;
}

message GrpcBackupGcDeletion {
  string BackupId     = 1;
  string Type         = 2;
  string CreatedAtUtc = 3;
  int64  Bytes        = 4;
  string Reason       = 5;
}

message GrpcBackupGcOrphan {
  string Name        = 1;
  bool   IsDirectory = 2;
  string Reason      = 3;
}
