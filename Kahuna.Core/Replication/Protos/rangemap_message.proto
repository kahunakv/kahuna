syntax = "proto3";

package Kahuna.Server.Replication.Protos;

// A single contiguous key-range routing record (mirrors RangeDescriptor).
message RangeDescriptorMessage {
  string keySpace = 1;
  optional string startKey = 2;  // absent = -inf within keySpace
  optional string endKey = 3;    // absent = +inf within keySpace
  int32 partitionId = 4;
  int64 generation = 5;
  // Quiesce window: this range refuses writes until quiescedUntil because its data is being
  // moved. Absent/zero = open for writes. quiesceOwner identifies the move that opened it, so
  // only that move's release closes it.
  int32  quiescedUntilNode     = 6;
  int64  quiescedUntilPhysical = 7;
  uint32 quiescedUntilCounter  = 8;
  int32  quiesceOwnerNode      = 9;
  int64  quiesceOwnerPhysical  = 10;
  uint32 quiesceOwnerCounter   = 11;
  optional string quiesceStartKey = 12;  // absent = -inf; only the moving sub-range is quiesced
  optional string quiesceEndKey   = 13;  // absent = +inf
}

// A full snapshot of the range-descriptor map, replicated on the meta partition.
// Snapshot (not delta) semantics: each committed entry fully replaces the map, so
// replaying the meta log on restore/failover converges on the latest map.
message RangeMapMessage {
  repeated RangeDescriptorMessage descriptors = 1;
  // Partitions a merge cut out of routing whose Raft group is not yet removed. The id is
  // recorded in the same entry as the cutover that vacated it, so the removal survives the
  // merging node losing leadership or restarting: whichever node leads next finishes it.
  repeated int32 retiredPartitionIds = 2;
}
