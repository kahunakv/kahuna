syntax = "proto3";

package Kahuna.Server.Replication.Protos;

// A durable prepared-intent transition, replicated on the participant's data partition. Each replica re-applies
// it through the prepared-intent state machine in Raft log order, so every replica holds the same unresolved
// intent set. Prepared intents are internal metadata, never inserted into the user key-value namespace.
enum PreparedIntentCommandKindMessage {
  PREPARED_INTENT_PREPARE = 0; // install a pending intent (idempotent for an exact-duplicate mutation)
  PREPARED_INTENT_RESOLVE = 1; // record the transaction's terminal decision on the intent (commit/abort)
  PREPARED_INTENT_REMOVE  = 2; // garbage-collect a resolved intent
}

message PreparedIntentCommandMessage {
  PreparedIntentCommandKindMessage kind = 1;

  // identity carried by every transition
  int32  transactionIdNode     = 2;
  int64  transactionIdPhysical = 3;
  uint32 transactionIdCounter  = 4;
  int64  epoch = 5;
  string key = 6;

  bool commit = 7; // resolve only

  // prepare payload
  int64  manifestHash = 8;
  string recordAnchorKey = 9;
  int32  commitTimestampNode     = 10;
  int64  commitTimestampPhysical = 11;
  uint32 commitTimestampCounter  = 12;
  int32  state = 13; // KeyValueState
  bytes  value = 14;
  bool   valueNull = 15;
  string bucket = 16;
  bool   bucketNull = 17;
  int64  revision = 18;
  int32  expiresNode     = 19;
  int64  expiresPhysical = 20;
  uint32 expiresCounter  = 21;
  bool   noRevision = 22;
  int64  baseRevision = 23;
  int32  baseState = 24; // KeyValueState
  int32  recoveryDeadlineNode     = 25;
  int64  recoveryDeadlinePhysical = 26;
  uint32 recoveryDeadlineCounter  = 27;
  int32  resolution = 28; // PreparedIntentResolution (carried so a replayed prepare reflects its resolved state)
}

// The fields every transition in a delta has in common. A delta almost always carries one transaction attempt's
// transitions for one partition, so without this each key repeats the same transaction identity, manifest hash,
// commit timestamp, recovery deadline and record-anchor key — tens of bytes plus a full string copy per key.
//
// When this is present the reader takes these fields from here for every command in the delta and each command's
// own copies are left at their proto3 defaults, so they are never written. Absent means every command carries its
// own, which is how a delta whose commands do not all agree is written, and how a delta written before this
// existed is read. Readers must therefore handle both forms; a writer that emits the compact form produces bytes
// an older reader would misread, so every node must be able to read it before any node writes it.
message PreparedIntentDeltaHeaderMessage {
  int32  transactionIdNode     = 1;
  int64  transactionIdPhysical = 2;
  uint32 transactionIdCounter  = 3;
  int64  epoch = 4;
  int64  manifestHash = 5;
  string recordAnchorKey = 6;
  int32  commitTimestampNode     = 7;
  int64  commitTimestampPhysical = 8;
  uint32 commitTimestampCounter  = 9;
  int32  recoveryDeadlineNode     = 10;
  int64  recoveryDeadlinePhysical = 11;
  uint32 recoveryDeadlineCounter  = 12;
}

// A batch of transitions committing as a single atomic data-partition log entry.
message PreparedIntentDeltaMessage {
  repeated PreparedIntentCommandMessage commands = 1;
  PreparedIntentDeltaHeaderMessage header = 2;
}

// One key's last transactionally committed head as remembered by the committed-head ledger: the revision
// and state the key reached when that commit's settlement applied, and the commit timestamp the ledger's
// retention horizon is measured against.
message CommittedHeadLedgerEntryMessage {
  string key = 1;
  int64  revision = 2;
  int32  state = 3; // KeyValueState
  int32  committedAtNode     = 4;
  int64  committedAtPhysical = 5;
  uint32 committedAtCounter  = 6;
}

// One (transaction identity, key) whose settlement (the removal of the resolved intent on that key) applied
// through the partition's log, with the commit timestamp of that intent — the time base the settled-identity
// memory's retention is measured against. A prepare that arrives for a remembered identity and key is a
// re-driven duplicate of an already-decided leg and is rejected instead of re-installed (see
// PreparedIntentStore). Keyed per key, not per transaction, so a range move that hands a decided transaction's
// still-unsettled leg on another key to this partition installs it as it must.
message SettledTransactionLedgerEntryMessage {
  int32  transactionIdNode     = 1;
  int64  transactionIdPhysical = 2;
  uint32 transactionIdCounter  = 3;
  int64  epoch = 4;
  int32  settledAtNode     = 5;
  int64  settledAtPhysical = 6;
  uint32 settledAtCounter  = 7;
  string key = 8;
}

// The full materialized intent set of a data partition, for the durable on-disk snapshot and whole-partition
// state transfer. Each entry is a PREPARE-kind command message, which already carries every intent field
// including its current resolution, so no separate entry shape is needed.
//
// Fields 2-7 carry the partition's committed-head ledger: the per-key heads fed by this partition's commit
// settlements and the watermark (the highest commit timestamp among them) that bounds the ledger's
// retention window. A reader that installs the intents must install the ledger with them, because the
// one-phase bundled commit gate judges a stalled bundle's validated base against exactly this state at
// apply time — a replica whose ledger differs from its peers' would decide a commit differently.
// ledgerPresent distinguishes a writer that persisted the ledger (possibly empty) from a snapshot written
// before the ledger existed; a reader that requires the ledger fails closed on the latter.
message PreparedIntentSnapshotMessage {
  repeated PreparedIntentCommandMessage intents = 1;
  repeated CommittedHeadLedgerEntryMessage committedHeads = 2;
  bool   ledgerPresent = 3;
  int32  ledgerPartitionId = 4;
  int32  ledgerWatermarkNode     = 5;
  int64  ledgerWatermarkPhysical = 6;
  uint32 ledgerWatermarkCounter  = 7;
  // The partition's highest applied log index the slice is known to reflect. Set by a whole-partition
  // export (the exporter's applied position when the section was written) and carried by the installing
  // replica: log entries at or below it are history the installed state already accounts for, so the
  // advisory staged-base fence does not judge them and the below-head witness does not fire on them.
  // Zero when unknown (a checkpoint snapshot of a slice that was never installed, or an older writer).
  int64  ledgerReflectedThroughIndex = 8;
  // Committed intents this node settled (resolved and removed from the live set) whose materialized row it had
  // queued for the background flush but not yet confirmed durable when the snapshot was written. A restart whose
  // replay starts above the intent's prepare delta and at or below its by-reference materialization record
  // resolves the record's value from here: the live set no longer holds the intent and the row never reached the
  // backend. A reader loads these into a separate set — never as live intents — and drops each one once the
  // flush carrying its row is confirmed.
  repeated PreparedIntentCommandMessage settledIntentsAwaitingFlush = 9;
  // The ledger slice's settled-identity memory (transactions whose settlement applied through this
  // partition's log within the memory's retention window). Part of the replicated slice: it decides whether
  // a prepare is a re-driven duplicate of a settled transaction, so a reader installs it with the heads.
  // Absent in a snapshot written before it existed, which loads as an empty memory.
  repeated SettledTransactionLedgerEntryMessage settledTransactions = 10;
  // The partition's highest applied log index whose intents the section's intent set FULLY reflects: the
  // exporter's applied position when its intent walk began (the walk is lock-free, so an intent prepared
  // while it ran may be missing, but one prepared at or below this position is present unless it was
  // removed during the walk, and that removal replays). A replay at or below it therefore installs no
  // intent the section lacks — the installed set is the truth there — which is what keeps a replica from
  // re-creating, out of history, an intent the exporter had rejected. At most ledgerReflectedThroughIndex.
  // Zero when unknown (an older writer, or a section not cut against a log position).
  int64  ledgerFullyReflectedThroughIndex = 11;
}
