name: Run Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  Kahuna-Tests:
    runs-on: ubuntu-latest
    env:
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      KAHUNA_SERVER_DEFAULT_LOG_LEVEL: Warning
      # Temporarily Warning (was Error) so the cluster bring-up failure dump surfaces Kommander's
      # leader-election/replication warnings (log-hole repair, log-matching rejection, "outdated,
      # cannot become leader"). Restore to Error once the convergence issue is diagnosed.
      KAHUNA_SERVER_LOG_LEVEL: Warning
      KAHUNA_TEST_LOG_LEVEL: Error
      KAHUNA_TEST_TIMING_SCALE: "3"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Thread-free browser-wasm smoke
        # A single-node embedded Kahuna on the default single-threaded browser-wasm runtime, under
        # Node.js: the net10.0-browser build of Kahuna.Core (KAHUNA_THREAD_FREE). It fails on a Thread
        # start or a blocking wait that the runtime refuses, on a deadlock, or on a wrong transaction
        # result. Normal .NET cannot catch a blocking wait: it has other threads to release it.
        run: bash scripts/run-wasm-smoke.sh
      - name: Run Kahuna Server
        run: (cd scripts && chmod +x ./run-server.sh && ./run-server.sh)
      - name: Run Client Tests
        run: (cd Kahuna.Client.Tests && dotnet test -l "console;verbosity=normal" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none)
      - name: Dump Kahuna Server logs
        if: failure()
        run: docker compose -f docker/local.yml logs --timestamps
      - name: Stop Kahuna Server
        if: always()
        run: docker compose -f docker/local.yml down -v
      - name: Run Server Tests
        run: (cd Kahuna.Server.Tests && dotnet test -l "console;verbosity=normal" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none)
