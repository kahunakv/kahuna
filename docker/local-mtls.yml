# Mutual TLS profile of the local cluster: one certificate per node (certs/mtls), node-to-node traffic
# authenticated by SHA-256 thumbprint, no cleartext listeners. Alternative to docker/local.yml, which
# keeps the development profile; both use the same project name, so bring one down before the other:
#   docker compose -f docker/local.yml down -v
#   docker compose -f docker/local-mtls.yml up -d --build
#
# Inside each container, the Raft port (8082/8084/8086) is the cluster listener: it requires a peer
# certificate and is not published. Application clients use 2071, published as 8082/8084/8086, so
# Kahuna.Client.Tests runs unchanged. Routing hints advertise that published address only.
name: kahuna
services:
  kahuna1:
    build:
      context: ..
      dockerfile: docker/DockerfileLocal
      args:
        KAHUNA_RAFT_NODENAME: kahuna1
        KAHUNA_RAFT_NODEID: 1
        KAHUNA_RAFT_HOST: 172.30.0.2
        KAHUNA_RAFT_PORT: 8082
        KAHUNA_HTTP_PORTS: ""
        KAHUNA_HTTPS_PORTS: 2071 8082
        KAHUNA_GRPC_CLEARTEXT_PORTS: ""
        KAHUNA_RAFT_SCHEME: https://
        KAHUNA_HTTPS_CERTIFICATE: /app/certs/node1.pfx
        KAHUNA_SECURITY_ARGS: --node-auth-mode MutualTls --trusted-client-cert-thumbprint 915F02B125C299836F8E86AEF125EDEFD82AC100E8452816605FF1A6C197C6F3 375A7AAF2F36DFBF45F519E540E91361A77BEF49AEA8BE25FDC7627AC11719A3 C2327F352487F41C0C4C92B26DA6FD50CE60635241259455666EA4CC83F183EA --trusted-server-cert-thumbprint 915F02B125C299836F8E86AEF125EDEFD82AC100E8452816605FF1A6C197C6F3 375A7AAF2F36DFBF45F519E540E91361A77BEF49AEA8BE25FDC7627AC11719A3 C2327F352487F41C0C4C92B26DA6FD50CE60635241259455666EA4CC83F183EA --advertised-client-endpoint https://localhost:8082 --disable-peer-endpoint-advertisement
        KAHUNA_INITIAL_CLUSTER: 172.30.0.3:8084 172.30.0.4:8086
    container_name: kahuna1
    ports:
      - "8082:2071"
    volumes:
      - kahuna1-data:/storage
      - kahuna1-dumps:/dumps
    environment:
      Logging__LogLevel__Default: ${KAHUNA_SERVER_DEFAULT_LOG_LEVEL:-Information}
      Logging__LogLevel__Kahuna: ${KAHUNA_SERVER_LOG_LEVEL:-Debug}
      Logging__LogLevel__Kommander: ${KAHUNA_SERVER_LOG_LEVEL:-Debug}
      KAHUNA_EXTRA_ARGS: ${KAHUNA_EXTRA_ARGS:-}
    networks:
      custom_net:
        ipv4_address: 172.30.0.2

  kahuna2:
    build:
      context: ..
      dockerfile: docker/DockerfileLocal
      args:
        KAHUNA_RAFT_NODENAME: kahuna2
        KAHUNA_RAFT_NODEID: 2
        KAHUNA_RAFT_HOST: 172.30.0.3
        KAHUNA_RAFT_PORT: 8084
        KAHUNA_HTTP_PORTS: ""
        KAHUNA_HTTPS_PORTS: 2071 8084
        KAHUNA_GRPC_CLEARTEXT_PORTS: ""
        KAHUNA_RAFT_SCHEME: https://
        KAHUNA_HTTPS_CERTIFICATE: /app/certs/node2.pfx
        KAHUNA_SECURITY_ARGS: --node-auth-mode MutualTls --trusted-client-cert-thumbprint 915F02B125C299836F8E86AEF125EDEFD82AC100E8452816605FF1A6C197C6F3 375A7AAF2F36DFBF45F519E540E91361A77BEF49AEA8BE25FDC7627AC11719A3 C2327F352487F41C0C4C92B26DA6FD50CE60635241259455666EA4CC83F183EA --trusted-server-cert-thumbprint 915F02B125C299836F8E86AEF125EDEFD82AC100E8452816605FF1A6C197C6F3 375A7AAF2F36DFBF45F519E540E91361A77BEF49AEA8BE25FDC7627AC11719A3 C2327F352487F41C0C4C92B26DA6FD50CE60635241259455666EA4CC83F183EA --advertised-client-endpoint https://localhost:8084 --disable-peer-endpoint-advertisement
        KAHUNA_INITIAL_CLUSTER: 172.30.0.2:8082 172.30.0.4:8086
    container_name: kahuna2
    ports:
      - "8084:2071"
    volumes:
      - kahuna2-data:/storage
      - kahuna2-dumps:/dumps
    environment:
      Logging__LogLevel__Default: ${KAHUNA_SERVER_DEFAULT_LOG_LEVEL:-Information}
      Logging__LogLevel__Kahuna: ${KAHUNA_SERVER_LOG_LEVEL:-Debug}
      Logging__LogLevel__Kommander: ${KAHUNA_SERVER_LOG_LEVEL:-Debug}
      KAHUNA_EXTRA_ARGS: ${KAHUNA_EXTRA_ARGS:-}
    networks:
      custom_net:
        ipv4_address: 172.30.0.3

  kahuna3:
    build:
      context: ..
      dockerfile: docker/DockerfileLocal
      args:
        KAHUNA_RAFT_NODENAME: kahuna3
        KAHUNA_RAFT_NODEID: 3
        KAHUNA_RAFT_HOST: 172.30.0.4
        KAHUNA_RAFT_PORT: 8086
        KAHUNA_HTTP_PORTS: ""
        KAHUNA_HTTPS_PORTS: 2071 8086
        KAHUNA_GRPC_CLEARTEXT_PORTS: ""
        KAHUNA_RAFT_SCHEME: https://
        KAHUNA_HTTPS_CERTIFICATE: /app/certs/node3.pfx
        KAHUNA_SECURITY_ARGS: --node-auth-mode MutualTls --trusted-client-cert-thumbprint 915F02B125C299836F8E86AEF125EDEFD82AC100E8452816605FF1A6C197C6F3 375A7AAF2F36DFBF45F519E540E91361A77BEF49AEA8BE25FDC7627AC11719A3 C2327F352487F41C0C4C92B26DA6FD50CE60635241259455666EA4CC83F183EA --trusted-server-cert-thumbprint 915F02B125C299836F8E86AEF125EDEFD82AC100E8452816605FF1A6C197C6F3 375A7AAF2F36DFBF45F519E540E91361A77BEF49AEA8BE25FDC7627AC11719A3 C2327F352487F41C0C4C92B26DA6FD50CE60635241259455666EA4CC83F183EA --advertised-client-endpoint https://localhost:8086 --disable-peer-endpoint-advertisement
        KAHUNA_INITIAL_CLUSTER: 172.30.0.2:8082 172.30.0.3:8084
    container_name: kahuna3
    ports:
      - "8086:2071"
    volumes:
      - kahuna3-data:/storage
      - kahuna3-dumps:/dumps
    environment:
      Logging__LogLevel__Default: ${KAHUNA_SERVER_DEFAULT_LOG_LEVEL:-Information}
      Logging__LogLevel__Kahuna: ${KAHUNA_SERVER_LOG_LEVEL:-Debug}
      Logging__LogLevel__Kommander: ${KAHUNA_SERVER_LOG_LEVEL:-Debug}
      KAHUNA_EXTRA_ARGS: ${KAHUNA_EXTRA_ARGS:-}
    networks:
      custom_net:
        ipv4_address: 172.30.0.4

volumes:
  kahuna1-data:
  kahuna2-data:
  kahuna3-data:
  kahuna1-dumps:
  kahuna2-dumps:
  kahuna3-dumps:

networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
